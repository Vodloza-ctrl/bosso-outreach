<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bosso Movie — Outreach</title>
<style>
  :root{
    --paper:#FFFFFF;
    --panel:#F6F5F1;
    --panel-2:#EFEDE5;
    --ink:#16160F;
    --ink-muted:#6B6A5E;
    --hairline:#E4E1D6;
    --brass:#A9812E;
    --brass-ink:#5C4718;
    --green:#2E6B4C;
    --green-bg:#E7F0EA;
    --brick:#9C4A34;
    --brick-bg:#F5E7E2;
    --blue-bg:#E8EEF3;
    --blue-ink:#33556E;
    --radius:10px;
    --shadow:0 1px 2px rgba(22,22,15,.06), 0 8px 24px rgba(22,22,15,.04);
    --sidebar-bg:#18170F;
    --sidebar-bg-2:#221F14;
    --sidebar-text:#B8B4A0;
    --sidebar-text-bright:#F3F1E8;
    --sidebar-hairline:#2E2B1D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{
    font-family:"Arial Narrow",Oswald,"Helvetica Neue Condensed",sans-serif;
    font-weight:800;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font:inherit;cursor:pointer;}

  #app{display:flex;min-height:100vh;}

  .rail{
    width:240px;flex:0 0 240px;
    background:var(--sidebar-bg);
    background-image:linear-gradient(160deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
    border-right:1px solid var(--sidebar-hairline);
    padding:20px 14px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .rail-brand{padding:6px 8px 16px;}
  .rail-brand .mark{display:flex;align-items:center;gap:8px;}
  .rail-brand .swatch{
    width:14px;height:14px;background:var(--brass);border-radius:2px;
    box-shadow:3px 0 0 var(--sidebar-bg), 3px 0 0 1px var(--brass), 6px 0 0 var(--brass);
  }
  .rail-brand .title{font-size:13px;letter-spacing:.06em;color:var(--sidebar-text-bright);}
  .rail-brand .sub{font-size:11px;color:var(--sidebar-text);margin-top:2px;}

  .ticker{
    margin:0 2px 16px;padding:9px 12px;border-radius:8px;
    background:rgba(169,129,46,.14);border:1px solid rgba(169,129,46,.3);
    min-height:34px;display:flex;align-items:center;
    overflow:hidden;
  }
  .ticker .ticker-dot{width:5px;height:5px;border-radius:50%;background:var(--brass);flex:0 0 auto;margin-right:8px;box-shadow:0 0 0 3px rgba(169,129,46,.18);}
  .ticker span.line{
    font-size:11.5px;color:var(--brass);font-weight:600;line-height:1.35;
    opacity:0;transform:translateY(3px);transition:opacity .4s ease, transform .4s ease;
  }
  .ticker span.line.show{opacity:1;transform:translateY(0);}

  nav.rail-nav{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
  nav.rail-nav button{
    text-align:left;background:none;border:none;
    padding:9px 10px;border-radius:8px;
    font-size:13px;color:var(--sidebar-text);
    display:flex;align-items:center;gap:9px;
  }
  nav.rail-nav button .dot{width:6px;height:6px;border-radius:50%;background:var(--sidebar-hairline);flex:0 0 auto;}
  nav.rail-nav button.active{background:rgba(169,129,46,.16);color:var(--sidebar-text-bright);font-weight:600;}
  nav.rail-nav button.active .dot{background:var(--brass);}
  nav.rail-nav button:hover:not(.active){background:rgba(255,255,255,.05);color:var(--sidebar-text-bright);}

  .rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--sidebar-hairline);}
  .rail-art{
    width:100%;border-radius:10px;overflow:hidden;margin-bottom:14px;
    display:flex;align-items:flex-end;justify-content:center;
    position:relative;
  }
  .rail-art::before{
    content:"";position:absolute;top:0;left:0;right:0;height:24px;
    background:linear-gradient(to bottom, var(--sidebar-bg), transparent);
    z-index:1;
  }
  .rail-art img{width:100%;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));}
  .logout-btn{color:var(--sidebar-text) !important;}
  .logout-btn:hover{color:var(--brick) !important;background:rgba(156,74,52,.12) !important;}

  .top-header{
    display:flex;align-items:center;gap:12px;padding:0 0 20px;
    border-bottom:1px solid var(--hairline);margin-bottom:24px;
  }
  .avatar-initials{
    width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto;
  }
  .top-header .name{font-size:14px;font-weight:700;}
  .top-header .role{font-size:12px;color:var(--ink-muted);}

  main{flex:1;min-width:0;padding:28px 34px 60px;max-width:1180px;}

  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:26px;margin:0 0 6px;}
  .rule{height:0;border-top:2px solid var(--ink);position:relative;margin:8px 0 4px;}
  .rule::after{content:"";position:absolute;left:0;top:5px;width:100%;height:1px;background:var(--hairline);}
  .page-sub{color:var(--ink-muted);font-size:13px;margin-top:8px;}

  .card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card + .card{margin-top:16px;}
  .card-head{padding:14px 18px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .card-head h2{font-size:12px;margin:0;letter-spacing:.08em;}
  .card-body{padding:16px 18px;}

  .grid{display:grid;gap:16px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .stat{padding:16px 18px;}
  .stat .label{font-size:10px;letter-spacing:.08em;color:var(--ink-muted);text-transform:uppercase;}
  .stat .value{font-size:26px;margin-top:6px;}
  .stat .bar{height:6px;background:var(--panel-2);border-radius:4px;margin-top:10px;overflow:hidden;}
  .stat .bar > span{display:block;height:100%;background:var(--brass);}
  .stat .meta{font-size:11px;color:var(--ink-muted);margin-top:6px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--hairline);}
  td{padding:10px 10px;border-bottom:1px solid var(--hairline);font-size:13px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable:hover{background:var(--panel);cursor:pointer;}

  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--panel-2);color:var(--ink-muted);white-space:nowrap;}
  .pill.status-not_contacted{background:var(--panel-2);color:var(--ink-muted);}
  .pill.status-contacted,.pill.status-meeting_booked{background:var(--blue-bg);color:var(--blue-ink);}
  .pill.status-proposal_sent,.pill.status-negotiating{background:#FBF0DC;color:var(--brass-ink);}
  .pill.status-won{background:var(--green-bg);color:var(--green);}
  .pill.status-lost{background:var(--brick-bg);color:var(--brick);}
  .pill.unassigned{background:var(--brick-bg);color:var(--brick);}

  .btn{border:1px solid var(--hairline);background:var(--paper);border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .btn:hover{background:var(--panel);}
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.primary:hover{background:#000;}
  .btn.small{padding:5px 10px;font-size:11.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  select,input[type=text],input[type=number],input[type=date],textarea{
    width:100%;border:1px solid var(--hairline);border-radius:7px;padding:8px 10px;
    font:inherit;background:var(--paper);color:var(--ink);
  }
  textarea{resize:vertical;min-height:120px;font-family:inherit;}
  label.field{display:block;font-size:11px;color:var(--ink-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .field-row{margin-bottom:14px;}

  .empty{padding:34px 18px;text-align:center;color:var(--ink-muted);font-size:13px;}
  .empty .display{font-size:14px;color:var(--ink);margin-bottom:4px;}

  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);
    padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .drawer-backdrop{position:fixed;inset:0;background:rgba(22,22,15,.28);opacity:0;pointer-events:none;transition:.18s;z-index:40;}
  .drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100vh;width:480px;max-width:92vw;
    background:var(--paper);box-shadow:-8px 0 30px rgba(22,22,15,.12);
    transform:translateX(100%);transition:.22s;z-index:41;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .drawer-head h3{margin:0 0 4px;font-size:18px;}
  .drawer-close{border:none;background:none;font-size:20px;color:var(--ink-muted);padding:2px 6px;}
  .drawer-body{padding:18px 20px;overflow-y:auto;flex:1;}
  .drawer-section{margin-bottom:22px;}
  .drawer-section h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 10px;}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;}
  .kv dt{color:var(--ink-muted);}
  .kv dd{margin:0;}

  .activity-item{padding:9px 0;border-bottom:1px solid var(--hairline);font-size:12.5px;}
  .activity-item:last-child{border-bottom:none;}
  .activity-item .type{font-weight:700;text-transform:capitalize;}
  .activity-item .when{color:var(--ink-muted);font-size:11px;}

  .hint-box{background:var(--blue-bg);border:1px solid #D8E3EA;border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--blue-ink);margin-bottom:14px;}
  .hint-box b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}

  ::selection{background:#FBEFD3;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer"></div>

<script>
const API = '';
let ME = null;
let TEAM = [];
let TAB = 'dashboard';
let PARTNERS = [];
let TEMPLATES = [];

async function api(path, opts={}) {
  const res = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) } });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.error || msg; } catch(e){}
    throw new Error(msg);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function fmtMoney(n) {
  if (n === null || n === undefined) return '$0';
  return '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits:0});
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s.replace(' ','T')+(s.includes('T')?'':'Z'));
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function statusLabel(s){ return (s||'').replaceAll('_',' '); }
function teamName(id){
  if (!id) return null;
  const t = TEAM.find(u=>u.id===id);
  return t ? (t.name || t.email) : id;
}

const TICKER_LINES = [
  "Siyinqaba. Every call moves us closer.",
  "Founding partner slots are limited — make today count.",
  "Consistency wins deals. One more follow-up today.",
  "We're building history — outreach by outreach.",
  "Every \"not yet\" is one step closer to \"yes.\"",
];
let tickerIdx = 0, tickerTimer = null;
function startTicker(){
  const el = document.getElementById('tickerLine');
  if (!el) return;
  clearInterval(tickerTimer);
  const show = () => {
    el.classList.remove('show');
    setTimeout(()=>{ el.textContent = TICKER_LINES[tickerIdx % TICKER_LINES.length]; el.classList.add('show'); tickerIdx++; }, 250);
  };
  show();
  tickerTimer = setInterval(show, 6000);
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <aside class="rail">
      <div class="rail-brand">
        <div class="mark"><span class="swatch"></span><span class="title display">The Bosso Movie</span></div>
        <div class="sub">Outreach &amp; partnerships</div>
      </div>
      <div class="ticker"><span class="ticker-dot"></span><span class="line" id="tickerLine"></span></div>
      <nav class="rail-nav">
        ${navBtn('dashboard','Dashboard')}
        ${navBtn('partners','Partners')}
        ${navBtn('outreach','Outreach')}
        ${navBtn('templates','Templates')}
        ${navBtn('materials','Materials')}
        ${navBtn('team','Team')}
      </nav>
      <div class="rail-foot">
        <div class="rail-art" id="railArt"><img src="/highlanders-cut-out.webp" alt="Born Into the Black and White — Highlanders FC feature film"></div>
        <nav class="rail-nav">
          <a href="/cdn-cgi/access/logout" class="logout-btn" style="text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:9px;text-decoration:none;">
            <span class="dot"></span>Log out
          </a>
        </nav>
      </div>
    </aside>
    <main id="main"></main>
  `;
  startTicker();
  renderTab();
}
function navBtn(id,label){
  return `<button data-tab="${id}" class="${TAB===id?'active':''}" onclick="setTab('${id}')"><span class="dot"></span>${label}</button>`;
}
function initials(name, email){
  const src = (name || email || '?').trim();
  const parts = src.split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return src.slice(0,2).toUpperCase();
}
function topHeader(){
  if (!ME) return '';
  return `
    <div class="top-header">
      <div class="avatar-initials">${initials(ME.name, ME.email)}</div>
      <div>
        <div class="name">${ME.name || ME.email}</div>
        <div class="role">${ME.role==='admin' ? 'Producer / Admin' : 'Team member'}</div>
      </div>
    </div>
  `;
}
window.setTab = function(id){ TAB = id; render(); };

async function renderTab(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if (TAB==='dashboard') await viewDashboard(main);
    else if (TAB==='partners') await viewPartners(main);
    else if (TAB==='outreach') await viewOutreach(main);
    else if (TAB==='templates') await viewTemplates(main);
    else if (TAB==='materials') await viewMaterials(main);
    else if (TAB==='team') await viewTeam(main);
  } catch(e){
    main.innerHTML = `<div class="empty">Couldn't load this — ${e.message}</div>`;
  }
}

async function viewDashboard(main){
  const [summary, followups] = await Promise.all([
    api('/api/dashboard'),
    api('/api/dashboard/followups'),
  ]);
  const goals = summary.goals || [];
  const partnerRows = summary.partners || [];
  const totalsByTrack = {};
  partnerRows.forEach(r=>{
    totalsByTrack[r.track] = totalsByTrack[r.track] || {won:0,inkind:0,count:0};
    totalsByTrack[r.track].won += (r.total||0);
    totalsByTrack[r.track].inkind += (r.in_kind||0);
    totalsByTrack[r.track].count += (r.count||0);
  });

  main.innerHTML = `
    ${topHeader()}
    <div class="page-head">
      <h1 class="display">Dashboard</h1>
      <div class="rule"></div>
      <div class="page-sub">Campaign window ${fmtDate(goals[0]?.window_start)} — ${fmtDate(goals[0]?.window_end)}</div>
    </div>
    <div class="card">
      <div class="card-head"><h2 class="display">Your follow-ups today</h2></div>
      <div class="card-body">
        ${followups.length ? `<table>
          <thead><tr><th>Type</th><th>Notes</th><th>Due</th></tr></thead>
          <tbody>${followups.map(f=>`
            <tr><td style="text-transform:capitalize">${f.type||'—'}</td><td>${f.next_action||f.notes||'—'}</td><td class="num">${fmtDate(f.next_action_date)}</td></tr>
          `).join('')}</tbody>
        </table>` : `<div class="empty"><div class="display">All clear</div>Nothing due today — good day to prospect something new.</div>`}
      </div>
    </div>
    <div class="grid cols-3" style="margin-top:16px;">
      ${goals.map(g=>{
        const t = totalsByTrack[g.track] || {won:0,count:0};
        const pct = g.target_amount ? Math.min(100, Math.round((t.won/g.target_amount)*100)) : 0;
        return `<div class="card stat">
          <div class="label">${g.track.replaceAll('_',' ')}</div>
          <div class="value num">${fmtMoney(t.won)} <span style="font-size:13px;color:var(--ink-muted);font-weight:400;">/ ${fmtMoney(g.target_amount)}</span></div>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="meta">${t.count||0} partner${t.count===1?'':'s'} · ${pct}% of target</div>
        </div>`;
      }).join('')}
    </div>
    ${ME && ME.role==='admin' ? `
      <div class="card" style="margin-top:16px;">
        <div class="card-head">
          <h2 class="display">AI targeting insights</h2>
          <button class="btn small" onclick="loadInsights()">Refresh</button>
        </div>
        <div class="card-body" id="insightsBox">
          <div class="empty">Click Refresh to have Claude review your current pipeline and suggest where to focus outreach next.</div>
        </div>
      </div>
    ` : ''}
  `;
}
window.loadInsights = async function(){
  const box = document.getElementById('insightsBox');
  box.innerHTML = `<div class="empty">Reviewing pipeline data…</div>`;
  try {
    const res = await api('/api/ai/insights');
    box.innerHTML = `<div style="white-space:pre-wrap;font-size:13px;line-height:1.6;">${res.insight.replace(/</g,'&lt;')}</div>`;
  } catch(e){
    box.innerHTML = `<div class="empty">${e.message}</div>`;
  }
};

async function viewPartners(main, filters={}){
  const params = new URLSearchParams();
  if (filters.track) params.set('track', filters.track);
  if (filters.status) params.set('status', filters.status);
  if (filters.owner) params.set('owner', filters.owner);
  PARTNERS = await api('/api/partners' + (params.toString() ? '?'+params.toString() : ''));
  if (!TEAM.length) TEAM = await api('/api/team');
  const isAdmin = ME && ME.role === 'admin';
  const view = filters.view || (window.__partnersView || 'table');

  const STATUSES = ['not_contacted','contacted','meeting_booked','proposal_sent','negotiating','won','lost'];

  main.innerHTML = `
    ${topHeader()}
    <div class="page-head">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;">
        <div><h1 class="display">Partners</h1><div class="rule"></div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn" onclick="openBulkAdd()">+ Bulk add</button>
          <button class="btn primary" onclick="openNewPartner()">+ Add partner</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;">
        <select id="fTrack" onchange="applyPartnerFilters()">
          <option value="">All tracks</option>
          <option value="corporate">Corporate</option>
          <option value="local_community">Local community</option>
        </select>
        <select id="fStatus" onchange="applyPartnerFilters()">
          <option value="">All statuses</option>
          ${STATUSES.map(s=>`<option value="${s}">${statusLabel(s)}</option>`).join('')}
        </select>
        ${isAdmin ? `<select id="fOwner" onchange="applyPartnerFilters()">
          <option value="">Everyone</option>
          <option value="unassigned">Unassigned only</option>
          ${TEAM.map(t=>`<option value="${t.id}">${t.name||t.email}</option>`).join('')}
        </select>` : ''}
        <div style="margin-left:auto;display:flex;gap:4px;">
          <button class="btn small ${view==='table'?'primary':''}" onclick="setPartnersView('table')">Table</button>
          <button class="btn small ${view==='kanban'?'primary':''}" onclick="setPartnersView('kanban')">Board</button>
        </div>
      </div>
    </div>
    ${view==='kanban' ? `
      <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;">
        ${STATUSES.map(s=>{
          const items = PARTNERS.filter(p=>p.status===s);
          return `<div style="min-width:230px;flex:0 0 230px;">
            <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin-bottom:8px;">${statusLabel(s)} <span style="color:var(--ink-muted);font-weight:400;">(${items.length})</span></div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${items.map(p=>`
                <div class="card" style="cursor:pointer;" onclick="openPartner('${p.id}')">
                  <div class="card-body" style="padding:12px 13px;">
                    <b style="font-size:13px;">${p.name}</b>

window.submitBulkAdd = async function(){
  const track = document.getElementById('bkTrack').value;
  const lines = document.getElementById('bkLines').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if (!lines.length) { toast('Add at least one line'); return; }
  const btn = document.getElementById('bkSubmit');
  const resultEl = document.getElementById('bkResult');
  btn.disabled = true;
  let ok = 0, failed = 0;
  for (const line of lines) {
    const [name, category, city] = line.split(',').map(s=>s && s.trim());
    if (!name) { failed++; continue; }
    try {
      await api('/api/partners', {method:'POST', body: JSON.stringify({name, track, category: category||null, city: city||null})});
      ok++;
    } catch(e){ failed++; }
    resultEl.textContent = `Added ${ok} so far${failed?`, ${failed} failed`:''}…`;
  }
  resultEl.textContent = `Done — ${ok} added${failed?`, ${failed} failed`:''}.`;
  btn.disabled = false;
  toast(`Added ${ok} lead${ok===1?'':'s'}`);
  renderTab();
};

          <thead><tr><th>Name</th><th>Type</th><th>Track</th><th>Added</th></tr></thead>
          <tbody>${ASSETS.map(a=>`
            <tr><td><b>${a.name}</b></td><td>${(a.file_type||'').toUpperCase()}</td><td>${a.track||'—'}</td><td>${fmtDate(a.created_at)}</td></tr>
          `).join('')}</tbody>
        </table>` : `<div class="empty"><div class="display">Nothing uploaded yet</div>Upload the prospectus, rate card, and one-pagers here.</div>`}
      </div>
    </div>
  `;
}
window.openUploadAsset = function(){
  openDrawer(`
    <div class="drawer-head"><div><h3>Upload material</h3></div><button class="drawer-close" onclick="closeDrawer()">&times;</button></div>
    <div class="drawer-body">
      <div class="field-row"><label class="field">Name</label><input type="text" id="asName" placeholder="e.g. Partnership Prospectus"></div>
      <div class="field-row"><label class="field">Track</label><select id="asTrack"><option value="">Any</option><option value="corporate">Corporate</option><option value="local_community">Local community</option></select></div>
      <div class="field-row"><label class="field">File</label><input type="file" id="asFile"></div>
      <button class="btn primary" id="asUploadBtn" onclick="uploadAsset()">Upload</button>
    </div>
  `);
};
window.uploadAsset = async function(){
  const fileInput = document.getElementById('asFile');
  const file = fileInput.files[0];
  const name = document.getElementById('asName').value || (file && file.name);
  const track = document.getElementById('asTrack').value || null;
  if (!file) { toast('Choose a file first'); return; }
  const btn = document.getElementById('asUploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const base64Data = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = () => rej(new Error('Read failed'));
      r.readAsDataURL(file);
    });
    const file_type = (file.name.split('.').pop() || 'pdf');
    await api('/api/assets', {method:'POST', body: JSON.stringify({name, track, file_type, base64Data})});
    toast('Uploaded');
    closeDrawer();
    renderTab();
  } catch(e){ toast('Upload failed: '+e.message); btn.disabled=false; btn.textContent='Upload'; }
};

async function viewTeam(main){
  TEAM = await api('/api/team');
  const isAdmin = ME && ME.role === 'admin';
  main.innerHTML = `
    ${topHeader()}
    <div class="page-head">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;">
        <div><h1 class="display">Team</h1><div class="rule"></div></div>
        ${isAdmin ? `<button class="btn primary" onclick="openAddTeamMember()">+ Add team member</button>` : ''}
      </div>
      <div class="page-sub">${isAdmin ? "You assign who owns each partner, and can give each person a default track to focus on." : 'Only the producer assigns partner ownership.'}</div>
    </div>
    <div class="card">
      <div class="card-body" style="padding:0;">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Assigned track</th>${isAdmin?'<th></th>':''}</tr></thead>
          <tbody>${TEAM.map(t=>`
            <tr>
              <td><b>${t.name||'—'}</b></td>
              <td>${t.email}</td>
              <td><span class="pill ${t.role==='admin'?'status-won':''}">${t.role==='admin'?'Producer / Admin':'Team member'}</span></td>
              <td>
                ${isAdmin && t.role!=='admin' ? `
                  <select onchange="setAssignedTrack('${t.id}', this.value)" style="width:auto;padding:4px 8px;font-size:12px;">
                    <option value="" ${!t.assigned_track?'selected':''}>Any</option>
                    <option value="corporate" ${t.assigned_track==='corporate'?'selected':''}>Corporate</option>
                    <option value="local_community" ${t.assigned_track==='local_community'?'selected':''}>Local community</option>
                  </select>
                ` : (t.assigned_track ? t.assigned_track.replaceAll('_',' ') : '—')}
              </td>
              ${isAdmin ? `<td>${t.id!==ME.id ? `<button class="btn small" onclick="toggleRole('${t.id}','${t.role}')">${t.role==='admin'?'Make member':'Make admin'}</button>`:''}</td>` : ''}
            </tr>
          `).join('')}</tbody>
        </table>
      </div>
    </div>
  `;
}
window.setAssignedTrack = async function(id, assigned_track){
  try {
    await api('/api/team/'+id, {method:'PATCH', body: JSON.stringify({assigned_track: assigned_track || null})});
    toast('Updated');
    TEAM = await api('/api/team');
  } catch(e){ toast('Could not update: '+e.message); }
};
window.openAddTeamMember = function(){
  openDrawer(`
    <div class="drawer-head"><div><h3>Add team member</h3></div><button class="drawer-close" onclick="closeDrawer()">&times;</button></div>
    <div class="drawer-body">
      <div class="hint-box"><b>Note</b>This registers them in the system. They still log in themselves via Cloudflare Access — make sure their email is also added to the Access policy.</div>
      <div class="field-row"><label class="field">Name</label><input type="text" id="tmName"></div>
      <div class="field-row"><label class="field">Email</label><input type="text" id="tmEmail"></div>
      <div class="field-row"><label class="field">Role</label><select id="tmRole"><option value="team_member">Team member</option><option value="admin">Admin</option></select></div>
      <div class="field-row"><label class="field">Default track</label><select id="tmTrack"><option value="">Any</option><option value="corporate">Corporate</option><option value="local_community">Local community</option></select></div>
      <button class="btn primary" onclick="saveTeamMember()">Add</button>
    </div>
  `);
};
window.saveTeamMember = async function(){
  const body = {
    name: document.getElementById('tmName').value,
    email: document.getElementById('tmEmail').value,
    role: document.getElementById('tmRole').value,
    assigned_track: document.getElementById('tmTrack').value || null,
  };
  if (!body.email) { toast('Email is required'); return; }
  try {
    await api('/api/team', {method:'POST', body: JSON.stringify(body)});
    toast('Added');
    closeDrawer();
    renderTab();
  } catch(e){ toast('Could not add: '+e.message); }
};
window.toggleRole = async function(id, currentRole){
  const role = currentRole === 'admin' ? 'team_member' : 'admin';
  try {
    await api('/api/team/'+id, {method:'PATCH', body: JSON.stringify({role})});
    toast('Updated');
    renderTab();
  } catch(e){ toast('Could not update: '+e.message); }
};

function openDrawer(html){
  document.getElementById('drawer').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
}
window.closeDrawer = function(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
};
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

(async function boot(){
  try {
    ME = await api('/api/me');
    TEAM = await api('/api/team');
  } catch(e){
    document.getElementById('app').innerHTML = `<div class="empty" style="margin:60px auto;max-width:400px;"><div class="display">Couldn't load your profile</div>${e.message}</div>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
